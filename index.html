<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>60s Vintage Tape - fatur62</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7a4623">
</head>
<body>

    <div class="vintage-player">
        <div class="screw top-left"></div>
        <div class="screw top-right"></div>

        <div class="top-bar">
            <span class="brand-tag">✦ ANALOG AUDIO SYSTEM ✦</span>
            <span class="dev-tag">DEV: <i>fatur62</i></span>
        </div>

        <div class="header-section">
            <div class="radio-display" id="freqDisplay">
                <div class="dial-scale">
                    <span class="mhz">FM &nbsp;&nbsp; 88 &nbsp;&nbsp; 102 &nbsp;&nbsp; 108 &nbsp; MHz</span>
                    <div class="khz">AM &nbsp; 550 &nbsp; 700 &nbsp; 1600 &nbsp;... kHz</div>
                </div>
                <div class="dial-needle" id="dialNeedle"></div>
                <div class="radio-light" id="radioLight"></div>
            </div>
            <div class="top-knob-container">
                <div class="metal-knob small-knob">
                    <div class="knob-cap"></div>
                </div>
            </div>
        </div>

        <div class="main-body-grid">
            <div class="left-control-panel">
                <div class="left-top-row">
                    <div class="vu-meter">
                        <div class="vu-dial">
                            <div class="vu-needle" id="vuNeedle"></div>
                        </div>
                    </div>
                    <div class="brand-badge">
                        <span class="badge-title">FATUR</span>
                        <span class="badge-sub">JADUL & HIGH-FIDELITY</span>
                    </div>
                </div>

                <div class="switches-row">
                    <div class="switch-group">
                        <label>EXTRA VOLUME</label>
                        <button id="btnBoost" class="toggle-switch-handle"><span></span></button>
                    </div>
                    <div class="switch-group">
                        <label>BASS ENHANCE</label>
                        <button id="btnBass" class="toggle-switch-handle"><span></span></button>
                    </div>
                </div>

                <div class="playlist-card">
                    <div class="card-title">PLAYLIST CARD</div>
                    <ul id="playlistView" class="playlist-list">
                        <li class="empty-msg">1. TIDAK ADA LAGU</li>
                        <li>2. KLIK FOLDER DI KANAN</li>
                    </ul>
                </div>
            </div>

            <!-- Bagian Deck Kaset Murni CSS -->
            <div class="center-deck-panel">
                <div class="cassette-deck">
                    <div class="deck-screw tl"></div><div class="deck-screw tr"></div>
                    <div class="deck-screw bl"></div><div class="deck-screw br"></div>
                    
                    <!-- Kaset Vintase Rendered CSS -->
                    <div class="css-cassette-body" id="reelsArea">
                        <!-- Pita Magnetik Kiri & Kanan -->
                        <div class="tape-reel-left"></div>
                        <div class="tape-reel-right"></div>

                        <!-- Label Stiker Putih & Running Text -->
                        <div class="css-label-sticker">
                            <div class="ticker-wrapper">
                                <div class="clean-running-title" id="songTitle">TIDAK ADA LAGU (PILIH FILE)</div>
                            </div>
                        </div>

                        <!-- Tulisan fatur62 Transparan di Bodi Kaset -->
                        <div class="css-watermark">fatur62</div>

                        <!-- Jendela Transparan Tempat Roda -->
                        <div class="css-transparent-window">
                            <!-- Roda Gerigi Kiri -->
                            <div class="hub-overlay left-hub-pos" id="leftReel">
                                <div class="spoke s1"></div>
                                <div class="spoke s2"></div>
                                <div class="spoke s3"></div>
                            </div>
                            <!-- Roda Gerigi Kanan -->
                            <div class="hub-overlay right-hub-pos" id="rightReel">
                                <div class="spoke s1"></div>
                                <div class="spoke s2"></div>
                                <div class="spoke s3"></div>
                            </div>
                        </div>

                        <!-- Detail Bagian Bawah Kaset (Gigi Pengunci) -->
                        <div class="css-cassette-bottom-teeth">
                            <div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-knobs-panel">
                <div class="knob-control-item">
                    <span class="knob-label-top">PLAY NAME</span>
                    <div class="metal-knob med-knob"><div class="knob-cap"></div></div>
                </div>
                <div class="knob-control-item">
                    <span class="knob-label-top">BASS ENHANCE</span>
                    <div class="metal-knob med-knob"><div class="knob-cap"></div></div>
                </div>
                <div class="knob-control-item">
                    <span class="knob-label-top">NEXT / FOLDER</span>
                    <div class="metal-knob large-knob"><div class="knob-cap"></div></div>
                </div>
            </div>
        </div>

        <div class="button-panel">
            <span class="btn-caption">PREV</span>
            <span class="btn-caption">PREV</span>
            <span class="btn-caption">PLAY</span>
            <span class="btn-caption">PAUSE</span>
            <span class="btn-caption">NEXT</span>
            <span class="btn-caption">FOLDER</span>
        </div>
        <div class="button-row-physical">
            <button id="btnPrev" class="btn-mech">⏮</button>
            <button id="btnPrev" class="btn-mech">⏪</button>
            <button id="btnPlay" class="btn-mech">▶</button>
            <button id="btnPause" class="btn-mech">⏸</button>
            <button id="btnNext" class="btn-mech">⏭</button>
            <label class="btn-mech btn-folder-label" for="fileInput">📁</label>
        </div>

        <div class="screw bottom-left"></div>
        <div class="screw bottom-right"></div>
    </div>

    <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
    <audio id="audioEngine"></audio>

    <script src="script.js"></script>
</body>
</html>
